services:
  # ── Graph Database ────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26
    container_name: red-social-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Compose resolves ${...} at parse time from the host .env — the container
      # never sees NEO4J_USER or NEO4J_PASSWORD as env vars (which would confuse
      # the Neo4j 5 config parser). cypher-shell exits 0 on success, 1 on failure.
      test:
        - CMD-SHELL
        - cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-changeme}" 'RETURN 1' >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s


  rustfs-permissions:
    image: busybox:1.37
    user: root
    entrypoint: ["sh", "-ec", "chown 10001:10001 /data"]
    volumes:
      - rustfs_data:/data

  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # local console
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # Bucket private by default; only avatar reads are anonymous.
  rustfs-init:
    image: pgsty/mc:latest
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-red-social}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        mc mb --ignore-existing "local/$$RUSTFS_BUCKET"
        mc anonymous set none "local/$$RUSTFS_BUCKET"
        mc anonymous set download "local/$$RUSTFS_BUCKET/avatars"
        mc anonymous set download "local/$$RUSTFS_BUCKET/posts"

  # ── Quarkus Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: red-social-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # The JWT keypair lives on the host, never in the image. Read-only.
      - ./secrets:/deployments/config:ro
    environment:
      QUARKUS_PROFILE: prod
      # Neo4j
      QUARKUS_NEO4J_URI: bolt://neo4j:7687
      QUARKUS_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USER:-neo4j}
      QUARKUS_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      # RustFS / S3
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://rustfs:9000
      QUARKUS_S3_AWS_REGION: ${AWS_REGION:-us-east-1}
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      # The Quarkus static provider wins over the AWS SDK env chain, so these
      # come from RUSTFS_* — not from AWS_ACCESS_KEY_ID.
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      APP_S3_BUCKET: ${RUSTFS_BUCKET:-red-social}
      APP_S3_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      APP_WEBSOCKET_ALLOWED_ORIGIN: ${WEBSOCKET_ALLOWED_ORIGIN:-http://localhost:3000}
      # JWT — resolved from the read-only bind mount above.
      # Run ./scripts/generate-jwt-keys.sh before starting the stack.
      SMALLRYE_JWT_SIGN_KEY_LOCATION: ${SMALLRYE_JWT_SIGN_KEY_LOCATION:-/deployments/config/privateKey.pem}
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: ${MP_JWT_VERIFY_PUBLICKEY_LOCATION:-/deployments/config/publicKey.pem}
      APP_JWT_SECRET: ${JWT_SECRET}
      # Web Push VAPID
      APP_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      APP_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      APP_VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@redsocial.dev}
    depends_on:
      neo4j:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      # eclipse-temurin:21-jre-alpine has no curl, but busybox provides wget.
      # Verified: exit 0 on HTTP 200, exit 1 on HTTP error AND on connection
      # refused. No apk add, no extra layer in the image.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/q/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      # A cold JVM needs time before the first probe is meaningful; without
      # this, early failures would burn the retry budget and flap the service.
      start_period: 90s

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: red-social-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  rustfs_data:
