services:
  # ── Graph Database ────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26
    container_name: red-social-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Compose resolves ${...} at parse time from the host .env — the container
      # never sees NEO4J_USER or NEO4J_PASSWORD as env vars (which would confuse
      # the Neo4j 5 config parser). cypher-shell exits 0 on success, 1 on failure.
      test:
        - CMD-SHELL
        - cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-changeme}" 'RETURN 1' >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # ── Object Storage (S3-compatible) ────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: red-social-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # This release tag still ships curl (verified: 8.11.0 musl). `latest` had
      # drifted to a curl-less build, which is what broke this probe — pinning
      # the tag is the fix. -sf makes curl exit non-zero on both HTTP errors
      # (22) and connection failures (7), so the gate actually fails.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ── MinIO bucket init (one-shot) ───────────────────────────────────────────────
  minio-init:
    # Pinned by digest: this environment cannot enumerate Docker Hub tags, so
    # the digest is the only immutable reference we can actually verify. The
    # bundled client is `mc version RELEASE.2025-08-13T08-35-41Z`.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: red-social-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET:-red-social};
        mc anonymous set none local/${MINIO_BUCKET:-red-social};
        mc anonymous set download local/${MINIO_BUCKET:-red-social}/avatars;
        exit 0;
      "

  # ── Quarkus Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: red-social-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # The JWT keypair lives on the host, never in the image. Read-only.
      - ./secrets:/deployments/config:ro
    environment:
      QUARKUS_PROFILE: prod
      # Neo4j
      QUARKUS_NEO4J_URI: bolt://neo4j:7687
      QUARKUS_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USER:-neo4j}
      QUARKUS_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      # MinIO / S3
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://minio:9000
      QUARKUS_S3_AWS_REGION: ${AWS_REGION:-us-east-1}
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      # The Quarkus static provider wins over the AWS SDK env chain, so these
      # come from MINIO_ROOT_* — not from AWS_ACCESS_KEY_ID.
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: ${MINIO_BUCKET:-red-social}
      APP_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      APP_WEBSOCKET_ALLOWED_ORIGIN: ${WEBSOCKET_ALLOWED_ORIGIN:-http://localhost:3000}
      # JWT — resolved from the read-only bind mount above.
      # Run ./scripts/generate-jwt-keys.sh before starting the stack.
      SMALLRYE_JWT_SIGN_KEY_LOCATION: ${SMALLRYE_JWT_SIGN_KEY_LOCATION:-/deployments/config/privateKey.pem}
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: ${MP_JWT_VERIFY_PUBLICKEY_LOCATION:-/deployments/config/publicKey.pem}
      APP_JWT_SECRET: ${JWT_SECRET}
      # Web Push VAPID
      APP_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      APP_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      APP_VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@redsocial.dev}
    depends_on:
      neo4j:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # eclipse-temurin:21-jre-alpine has no curl, but busybox provides wget.
      # Verified: exit 0 on HTTP 200, exit 1 on HTTP error AND on connection
      # refused. No apk add, no extra layer in the image.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/q/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      # A cold JVM needs time before the first probe is meaningful; without
      # this, early failures would burn the retry budget and flap the service.
      start_period: 90s

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: red-social-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  minio_data:
