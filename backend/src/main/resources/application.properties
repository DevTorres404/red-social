# ── Application ───────────────────────────────────────────────────────────────
quarkus.application.name=red-social-backend
quarkus.application.version=1.0.0-SNAPSHOT

# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.limits.max-body-size=6M
quarkus.http.limits.max-form-attribute-size=6M

# ── Neo4j ─────────────────────────────────────────────────────────────────────
quarkus.neo4j.uri=${QUARKUS_NEO4J_URI:bolt://localhost:7687}
quarkus.neo4j.authentication.username=${QUARKUS_NEO4J_AUTHENTICATION_USERNAME:${NEO4J_USER:neo4j}}
quarkus.neo4j.authentication.password=${QUARKUS_NEO4J_AUTHENTICATION_PASSWORD:${NEO4J_PASSWORD:changeme}}

# ── Amazon S3 (MinIO) ─────────────────────────────────────────────────────────
quarkus.s3.endpoint-override=${QUARKUS_S3_ENDPOINT_OVERRIDE:http://localhost:9000}
quarkus.s3.aws.region=${QUARKUS_S3_AWS_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY:minioadmin}
quarkus.s3.path-style-access=true
app.minio.bucket=${APP_MINIO_BUCKET:red-social}
app.minio.public-endpoint=${APP_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

# Browser WebSocket tickets are supplied in Sec-WebSocket-Protocol, never URLs.
app.websocket.allowed-origin=${APP_WEBSOCKET_ALLOWED_ORIGIN:http://localhost:3000}
quarkus.websockets-next.server.supported-subprotocols=orbit-chat,orbit-feed
# No server-wide max-message-size: the knob is not per-endpoint, so a cap for the
# tiny feed subscribe frame would also close /ws/chat with 1009 on a long message.

# ── JWT ───────────────────────────────────────────────────────────────────────
# The signing keypair is never shipped inside the app. Both locations are
# created by scripts/generate-jwt-keys.sh and both sit outside the Maven
# resource path:
#   - secrets/ — the runtime/deployment source of truth. docker-compose.yml
#     bind-mounts it read-only at /deployments/config and points both vars
#     there via the environment.
#   - backend/dev-keys/ — dev-only mirror for `mvn quarkus:dev`, which runs
#     with no bind mount. It is NOT under src/main/resources, so Maven never
#     packages it.
# So the two properties below are external-only and carry no default: outside
# the dev profile the environment must point them at real files. The %dev.
# fallbacks at the bottom of this block resolve the dev-keys copies.
mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION}
mp.jwt.verify.issuer=https://red-social.dev
quarkus.smallrye-jwt.enabled=true
# Private key used by SmallRye JWT Build to sign tokens
smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION}
%dev.mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION:${user.dir}/dev-keys/publicKey.pem}
%dev.smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION:${user.dir}/dev-keys/privateKey.pem}

# ── Seed de datos de demostración ─────────────────────────────────────────────
# false (default): siembra sólo si la base está vacía, no duplica datos.
# true: borra todos los nodos y relaciones y vuelve a sembrar desde cero.
app.seed.force=${APP_SEED_FORCE:false}
app.seed.enabled=${APP_SEED_ENABLED:true}
%prod.app.seed.force=false

# ── Web Push VAPID ────────────────────────────────────────────────────────────
app.vapid.public-key=${APP_VAPID_PUBLIC_KEY:}
app.vapid.private-key=${APP_VAPID_PRIVATE_KEY:}
app.vapid.subject=${APP_VAPID_SUBJECT:mailto:admin@redsocial.dev}

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.health.extensions.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.redsocial".level=DEBUG

# ── Dev mode overrides ────────────────────────────────────────────────────────
%dev.quarkus.log.level=DEBUG
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.neo4j.uri=bolt://localhost:7687

# ── Test overrides ────────────────────────────────────────────────────────────
%test.quarkus.log.level=WARN
