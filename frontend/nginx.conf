server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Permitir uploads de hasta 6MB (debe coincidir con quarkus.http.limits.max-body-size)
    client_max_body_size 6M;

    # Always revalidate the SPA entry point so a deployment loads the new
    # fingerprinted bundles instead of keeping an older layout in the browser.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Handle React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket upgrade
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Proxy S3 media directly to RustFS (avoids needing a second Cloudflare tunnel)
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://rustfs:9000;
        proxy_set_header Host $host;
        # Enable CORS for images
        add_header Access-Control-Allow-Origin *;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
