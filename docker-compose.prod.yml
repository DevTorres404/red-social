# Standalone production stack. Never combine with docker-compose.yml:
# cloudflared runs on the host. Only loopback ports are published; public
# HTTPS hostnames route through the tunnel, not directly to the origin.
# Required settings live in .env (start from .env.prod.example).
name: orbit-prod

services:
  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [ private ]

  rustfs-permissions:
    image: busybox:1.37
    user: root
    restart: "no"
    entrypoint: [ "sh", "-ec", "chown 10001:10001 /data" ]
    volumes:
      - rustfs_data:/data
    networks: [ private ]

  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [ private ]

  rustfs-init:
    image: pgsty/mc:latest
    restart: "no"
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        mc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        mc mb --ignore-existing "local/$$RUSTFS_BUCKET"
        mc anonymous set none "local/$$RUSTFS_BUCKET"
        mc anonymous set download "local/$$RUSTFS_BUCKET/posts"
        mc anonymous set download "local/$$RUSTFS_BUCKET/avatars"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-red-social}
    depends_on:
      rustfs:
        condition: service_healthy
    networks: [ private ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Match the Linux owner of secrets/privateKey.pem (chmod 600). Do not make
    # the signing key world-readable just to satisfy a container UID mismatch.
    user: "${APP_UID:?Set APP_UID in .env}:${APP_GID:?Set APP_GID in .env}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets:/deployments/config:ro
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_NEO4J_URI: bolt://neo4j:7687
      QUARKUS_NEO4J_AUTHENTICATION_USERNAME: neo4j
      QUARKUS_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://rustfs:9000
      QUARKUS_S3_AWS_REGION: ${AWS_REGION:-us-east-1}
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      APP_S3_BUCKET: ${RUSTFS_BUCKET:-red-social}
      APP_S3_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:?Set browser-reachable RUSTFS_PUBLIC_ENDPOINT in .env}
      APP_WEBSOCKET_ALLOWED_ORIGIN: ${APP_ORIGIN:?Set exact APP_ORIGIN in .env}
      QUARKUS_HTTP_CORS_ORIGINS: ${APP_ORIGIN:?Set exact APP_ORIGIN in .env}
      SMALLRYE_JWT_SIGN_KEY_LOCATION: /deployments/config/privateKey.pem
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /deployments/config/publicKey.pem
      APP_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Generate VAPID keys in .env}
      APP_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Generate VAPID keys in .env}
      APP_VAPID_SUBJECT: ${VAPID_SUBJECT:?Set VAPID_SUBJECT in .env}
      APP_SEED_ENABLED: "false"
      APP_SEED_FORCE: "false"
    depends_on:
      neo4j:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/q/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [ private ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [ private ]

networks:
  private:

volumes:
  neo4j_data:
  neo4j_logs:
  rustfs_data:
